<div id="background">

<div id="stars"></div>

<div id="particles"></div>

<section id="startScreen">

<div class="center">

<section id="envelopeScene">

<div id="letterText"></div>

</div>

</section>

<audio
id="bgMusic"
loop
preload="auto">

src="assets/audio/music.mp3"
type="audio/mpeg">
