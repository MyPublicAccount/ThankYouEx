<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Last Letter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Background -->

<div id="background">

<div id="stars"></div>

<div id="particles"></div>

<div id="roseContainer"></div>

</div>

<!-- Start Screen -->

<section id="startScreen">

<div class="center">

<div class="mailIcon">💌</div>

<h1>One Last Letter</h1>

<p>Tap To Open</p>

</div>

</section>

<!-- Envelope -->

<section id="envelopeScene">

<div id="envelope">

<img
id="paperImg"
src="assets/images/paper.png"
alt="Paper">

<img
id="envelopeImg"
src="assets/images/envelope.png"
alt="Envelope">

<img
id="seal"
src="assets/images/wax_seal.png"
alt="Wax Seal">

</div>

</section>

<!-- Letter -->

<section id="letterScene">

<div id="letter">

<h1>

Dear My Ex Wifey,

</h1>

<div id="letterText"></div>

</div>

</section>

<!-- Controls -->

<div id="controls">

<button id="restartBtn">

Replay Story

</button>

</div>

<!-- Footer -->

<footer>

Made with ❤️ by

<a
href="https://t.me/ChinnuXbio"
target="_blank">

@ChinnuXbio

</a>

</footer>

<!-- Music -->

<audio
id="bgMusic"
preload="auto"
loop>

<source
src="assets/audio/music.mp3"
type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>

</html>
